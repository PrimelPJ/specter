[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "specter"
version = "0.1.0"
description = "Static Malware Analysis Sandbox"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Primel Jayawardana", email = "primelpj21@gmail.com"}]
dependencies = []

[project.scripts]
specter = "specter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
